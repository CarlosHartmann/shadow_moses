[project]
name = "shadow-moses"
version = "0.1.0"
description = ""
authors = [
    {name = "Smogshaik",email = "github@smog.sh"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "spacy (>=3.8.11,<4.0.0)",
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0.tar.gz",
    "pandas (>=3.0.0,<4.0.0)",
    "openai (>=2.17.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]

[tool.poetry]
packages = [{include = "shadow_moses", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
